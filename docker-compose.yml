services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tobz
      POSTGRES_PASSWORD: tobz
      POSTGRES_DB: tobz_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: "8080"
      BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://tobz:tobz@db:5432/tobz_api?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-ganti-di-production-minimal-32-char}
      CAPTCHA_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080/api/v1
        VITE_CAPTCHA_ENABLED: "false"
        VITE_TURNSTILE_SITEKEY: 1x00000000000000000000AA
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
